# Mise configuration for LLMOps Production Readiness Exam
# https://mise.jdx.dev/

[env]
API_URL = "http://localhost:8000"
LITELLM_URL = "http://localhost:8001"
QDRANT_URL = "http://localhost:6333"
MLFLOW_URL = "http://localhost:5001"
GRAFANA_URL = "http://localhost:3001"
PROMETHEUS_URL = "http://localhost:9090"

# Auth passwords for dev/test (bcrypt hashes generated at startup if not set)
AUTH_ADMIN_PASSWORD = "secret123"
AUTH_USER_PASSWORD = "password123"

# =============================================================================
# Core Tasks
# =============================================================================

[tasks.up]
description = "Start all services"
run = "docker compose up -d"

[tasks.down]
description = "Stop all services"
run = "docker compose down"

[tasks.clean]
description = "Stop services and remove volumes"
run = "docker compose down -v"

[tasks.status]
description = "Check all services health"
run = """
#!/usr/bin/env bash
set -e
echo "=== Service Status ==="
docker compose ps
echo ""
echo "=== API Health ==="
curl -s $API_URL/health | jq .
"""

[tasks.logs]
description = "View API logs"
run = "docker compose logs -f api"

[tasks.token]
description = "Get JWT authentication token"
run = """
#!/usr/bin/env bash
curl -s -X POST $API_URL/auth/login \
  -H "Content-Type: application/json" \
  -d '{"username": "admin", "password": "secret123"}' \
  | jq -r '.access_token'
"""

# =============================================================================
# Exercise Tests WITH LIFECYCLE TESTING
# =============================================================================

[tasks."test:ex1"]
description = "Check exercise 1 - Secure configuration"
run = "bash scripts/check_exercise.sh 1"

[tasks."test:ex2"]
description = "Check exercise 2 - Error handling and retry"
run = "bash scripts/check_exercise.sh 2"

[tasks."test:ex3"]
description = "Check exercise 3 - Structured logging"
run = "bash scripts/check_exercise.sh 3"

[tasks."test:ex4"]
description = "Check exercise 4 - Graceful shutdown (bonus)"
run = "bash scripts/check_exercise.sh 4"

[tasks."test:ex5"]
description = "Check exercise 5 - Timeouts and limits (bonus)"
run = "bash scripts/check_exercise.sh 5"

[tasks."test:ex6"]
description = "Check exercise 6 - Health checks (bonus)"
run = "bash scripts/check_exercise.sh 6"

[tasks."test:all"]
description = "Check the required exercises (1 to 3)"
run = """
#!/usr/bin/env bash
set -e

echo ""
echo "=========================================="
echo "  LLMOps Production Exam - Full Test Suite"
echo "=========================================="
echo ""

for ex in ex1 ex2 ex3; do  # required exercises; bonus: mise run test:ex4 / ex5 / ex6
  echo "▶ Running test:$ex..."
  mise run "test:$ex" || {
    echo "❌ test:$ex FAILED"
    exit 1
  }
  echo ""
done

echo ""
echo "=========================================="
echo "  ✅ REQUIRED EXERCISES PASSED"
echo "=========================================="
"""

[tasks."test:quick"]
description = "Quick test (no restarts) - for CI/CD"
run = """
#!/usr/bin/env bash
mise run test:ex4
"""

[tasks."test:unit"]
description = "Run unit tests inside Docker container"
run = """
#!/usr/bin/env bash
docker compose exec api bash -c "PYTHONPATH=/app/src/api pytest /app/tests/unit/ -v"
"""

[tasks."test:integration"]
description = "Run integration tests inside Docker container"
run = """
#!/usr/bin/env bash
docker compose exec api bash -c "PYTHONPATH=/app/src/api pytest /app/tests/integration/ -v"
"""
