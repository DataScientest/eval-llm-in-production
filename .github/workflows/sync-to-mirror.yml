name: Sync to Mirror Repository

on:
  push:
    branches: [student]

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'DataScientest/LLM-production-env-exam'
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
      - name: Add mirror remote
        run: |
          git remote add mirror https://github.com/DataScientest/eval-llm-in-production.git
      
      - name: Push to mirror repository
        run: |
          git push mirror student:main --force
